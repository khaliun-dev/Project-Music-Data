<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Listening Insights</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header>
      <h1>Music Listening Insights</h1>
      <p>Explore listening habits for each user.</p>
    </header>

    <main>
      <section aria-labelledby="user-selection-heading">
        <h2 id="user-selection-heading">Choose a user</h2>

        <label for="user-select">Select a user:</label>
        <select id="user-select" name="user-select">
          <option value="">Choose a user</option>
        </select>
      </section>

      <p id="status" role="status" aria-live="polite">
        Choose a user to view their listening insights.
      </p>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Listening insights</h2>
        <div id="results-list"></div>
      </section>
    </main>

    <script type="module" src="./script.mjs"></script>
  </body>
</html>
